# Dependency updates. Every version waits 5 days after its release before Dependabot proposes it
# (`cooldown`), so that a compromised release is likely to be found and pulled first; pnpm's
# `minimumReleaseAge` applies the same wait to installs by hand. Security updates are not delayed.
# Minor and patch updates are grouped per ecosystem; major updates come one by one, except for
# GitHub Actions, whose updates all come in one pull request (each one runs the whole CI).
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /runtimes/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # Later versions need Rust 1.88, above the MSRV (1.85).
      - dependency-name: regress
        versions: [">=0.10.5"]

  - package-ecosystem: npm
    directories:
      - /
      - /examples/pnpm-monorepo
      - /examples/react-tanstack
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # The oldest TypeScript generated code supports (CLAUDE.md); it stays at 5.8.
      - dependency-name: typescript58
      # React Native 0.75's Babel preset, for the Hermes VM of that release (runtimes/typescript/hermes).
      - dependency-name: babel-preset-rn075
      # React Native's Babel preset (0.88) needs Babel 7, and its runtime transform emits helpers
      # of @babel/runtime 7.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/runtime"
        update-types: ["version-update:semver-major"]
      # The types of the oldest supported Node (engines: >=22), so that code does not use newer
      # APIs.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directories:
      - /runtimes/python
      - /packages/plugin-python
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      uv:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directories:
      - /runtimes/go
      - /packages/plugin-go
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]

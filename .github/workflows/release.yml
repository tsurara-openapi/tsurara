# Releases a version: push a tag `v<version>` whose version every package already has
# (scripts/release-version.mjs). The workflow builds the CLI for every platform, attests the
# archives' provenance, and drafts a GitHub release with them; the publish jobs then wait for an
# approval of the `release` environment and publish to npm, crates.io and PyPI with trusted
# publishing (no stored tokens), and tag the Go modules.
#
# Jobs that can mint a publish token (`id-token: write`) install and build nothing: the packages are
# built in jobs without that permission and handed over as artifacts, so a compromised build
# dependency cannot publish. The tool cache of mise is off in every job.
#
# Run it by hand (workflow_dispatch) to build and pack everything without publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(node scripts/release-version.mjs "${GITHUB_REF_NAME#v}")
          else
            version=$(node scripts/release-version.mjs)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One binary per platform of packages/tsurara/lib/platforms.js. Linux binaries are static (musl).
  binary:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest, run: true }
          - { target: x86_64-apple-darwin, runner: macos-latest, run: false }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, run: true }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, run: true }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, run: true }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, run: true }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The Rust version of mise.toml, through the runner's rustup.
      - run: |
          rust=$(sed -n 's/^rust = "\(.*\)"$/\1/p' mise.toml)
          rustup toolchain install "$rust" --profile minimal --target "${{ matrix.target }}"
          rustup default "$rust"
      - run: cargo build --release --locked -p tsurara-cli --target "${{ matrix.target }}"
      - if: matrix.run
        run: target/${{ matrix.target }}/release/tsurara --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/tsurara
            target/${{ matrix.target }}/release/tsurara.exe
          if-no-files-found: error

  # Archives for the GitHub release and the npm packages, with the notices of the linked crates.
  package:
    needs: [version, binary]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries
      - run: node scripts/third-party-licenses.mjs target/THIRD_PARTY_LICENSES.md
      - name: Archives
        run: |
          mkdir -p dist
          for dir in binaries/binary-*; do
            target=${dir#binaries/binary-}
            mv "$dir" "binaries/$target"
            stage="$RUNNER_TEMP/tsurara-$VERSION-$target"
            mkdir -p "$stage"
            cp binaries/"$target"/* LICENSE README.md target/THIRD_PARTY_LICENSES.md "$stage/"
            if [[ "$target" == *windows* ]]; then
              (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/tsurara-$VERSION-$target.zip" "tsurara-$VERSION-$target")
            else
              chmod +x "$stage/tsurara"
              tar -C "$RUNNER_TEMP" -czf "dist/tsurara-$VERSION-$target.tar.gz" "tsurara-$VERSION-$target"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
      - run: node scripts/npm-packages.mjs "$VERSION" binaries npm
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsurara-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm
          path: npm
          if-no-files-found: error

  # A draft: publish it on GitHub after checking the notes.
  github-release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes

  # The npm, crates.io and PyPI packages, built and checked without any publishing permission.
  build-packages:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tsurara/client --filter @tsurara/plugin build
      - run: |
          mkdir -p npm-libraries
          for dir in runtimes/typescript packages/plugin; do
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm-libraries")
          done
      # The crates build as they will be published (`cargo publish` then runs with --no-verify).
      - run: cargo package --locked -p tsurara-loader -p tsurara-sem -p tsurara-naming -p tsurara-pretty -p tsurara-lower -p tsurara-sample -p tsurara-backend -p tsurara-plugin
      - run: cargo package --locked --manifest-path runtimes/rust/Cargo.toml
      - run: |
          for project in runtimes/python packages/plugin-python; do
            uv build --project "$project" --out-dir python
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-libraries
          path: npm-libraries
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python
          path: python
          if-no-files-found: error

  npm:
    if: github.ref_type == 'tag'
    needs: [package, build-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm
          path: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-libraries
          path: npm-libraries
      # The platform packages before `tsurara`, which depends on them. `--ignore-scripts`: nothing
      # of the packages runs here.
      - name: Publish
        run: |
          for dir in npm/cli-* npm/tsurara; do
            npm publish "./$dir" --provenance --access public --ignore-scripts
          done
          for tarball in npm-libraries/*.tgz; do
            npm publish "./$tarball" --provenance --access public --ignore-scripts
          done

  crates:
    if: github.ref_type == 'tag'
    needs: [package, build-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # The crates that external backends, plugins and generated Rust code depend on. The CLI is
      # not published to crates.io: it embeds the runtimes from outside its crate directory.
      # `--no-verify`: build-packages built them; nothing is compiled while a token exists.
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked --no-verify -p tsurara-loader -p tsurara-sem -p tsurara-naming -p tsurara-pretty -p tsurara-lower -p tsurara-sample -p tsurara-backend -p tsurara-plugin
          cargo publish --locked --no-verify --manifest-path runtimes/rust/Cargo.toml

  pypi:
    if: github.ref_type == 'tag'
    needs: [package, build-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python
          path: python
      - run: uv publish --trusted-publishing always python/*

  # Go modules are published by their tags; the module proxy fetches them from the repository.
  go:
    if: github.ref_type == 'tag'
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: |
          for module in runtimes/go packages/plugin-go; do
            git tag "$module/v$VERSION" "$GITHUB_SHA"
          done
          git push origin "runtimes/go/v$VERSION" "packages/plugin-go/v$VERSION"

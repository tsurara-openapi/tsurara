name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  corpus-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSURARA_REQUIRE_CHECKERS: rust
      TSURARA_REQUIRE_CORPUS: "1"
      TSURARA_CHECKER_CACHE: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: nproc; free -m; df -h; swapon --show
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/corpus
          key: corpus-${{ hashFiles('corpus/sources.json') }}
      - run: node scripts/fetch-corpus.mjs
      - run: cargo test --release -p tsurara-cli --test corpus --no-run
      - run: free -m; df -h /; du -sh target
      - name: Corpus (Rust) with memory and disk every 10 s
        run: |
          (while true; do
             echo "MON $(date +%T) mem_used_mb=$(free -m | awk 'NR==2{print $3}') avail_mb=$(free -m | awk 'NR==2{print $7}') swap_used_mb=$(free -m | awk 'NR==3{print $3}') disk_avail=$(df -h / | awk 'NR==2{print $4}') top=$(ps -eo rss,comm --sort=-rss | awk 'NR==2{print $2":"int($1/1024)"MB"}')"
             sleep 10
           done) &
          cargo test --release -p tsurara-cli --test corpus compile_as_rust -- --nocapture

name: Weekly

# Checks too slow for every push (design.md chapter 13): many random definitions through every
# checker with a new seed. The real-world definitions compile as Rust on every push
#.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TSURARA_REQUIRE_CHECKERS: typescript,python,rust,go
      TSURARA_PROPTEST_CASES: "2000"
      TSURARA_PROPTEST_SEED: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project runtimes/python --locked
      - run: cargo test --release -p tsurara-cli --test properties
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-failures
          path: target/proptest-failures

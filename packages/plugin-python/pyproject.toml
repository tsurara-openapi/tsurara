[project]
name = "tsurara-plugin"
version = "0.1.1"
description = "Write tsurara plugins in Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["tsurara-client"]

[tool.uv.sources]
tsurara-client = { path = "../../runtimes/python", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/tsurara-openapi/tsurara"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsurara_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

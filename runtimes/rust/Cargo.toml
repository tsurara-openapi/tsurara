[package]
name = "tsurara-client"
version = "0.1.0"
description = "Runtime library for Rust code generated by tsurara"
license = "MIT"
repository = "https://github.com/tsurara-openapi/tsurara"
edition = "2024"
rust-version = "1.85"

# Its own workspace: the runtime is not part of the generator's.
[workspace]

[features]
default = ["client", "reqwest"]
# The HTTP client. Generated types need none of it: with `default-features = false` the runtime has
# only serde, serde_json and indexmap as dependencies.
client = ["dep:tokio", "dep:fastrand", "dep:httpdate"]
# The default transport over reqwest (rustls). Without it, give the client a `Transport`.
reqwest = ["client", "dep:reqwest"]
# A mock transport for tests (`tsurara_client::testing`).
testing = ["client"]

[dependencies]
fastrand = { version = "2", optional = true }
httpdate = { version = "1", optional = true }
indexmap = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

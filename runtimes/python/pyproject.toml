[project]
name = "tsurara-client"
version = "0.1.2"
description = "Runtime library for Python code generated by tsurara"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/tsurara-openapi/tsurara"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsurara_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

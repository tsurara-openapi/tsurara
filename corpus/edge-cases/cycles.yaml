# Cycles through properties, arrays, maps, allOf, and unions.
openapi: 3.1.0
info: { title: cycles, version: "1" }
paths:
  /tree:
    get:
      operationId: getTree
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
components:
  schemas:
    Node:
      type: object
      required: [children]
      properties:
        parent: { $ref: "#/components/schemas/Node" }
        children: { type: array, items: { $ref: "#/components/schemas/Node" } }
        byName: { type: object, additionalProperties: { $ref: "#/components/schemas/Node" } }
        next: { anyOf: [{ $ref: "#/components/schemas/Node" }, { type: "null" }] }
    A:
      type: object
      properties:
        b: { $ref: "#/components/schemas/B" }
    B:
      type: object
      properties:
        a: { $ref: "#/components/schemas/A" }
    Base:
      type: object
      properties:
        derived: { $ref: "#/components/schemas/Derived" }
    Derived:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            extra: { type: string }
    Json:
      oneOf:
        - { type: "null" }
        - { type: boolean }
        - { type: number }
        - { type: string }
        - { type: array, items: { $ref: "#/components/schemas/Json" } }
        - { type: object, additionalProperties: { $ref: "#/components/schemas/Json" } }
    # Aliases that only refer to themselves (found by the property tests): unknown.
    Loop: { $ref: "#/components/schemas/Loop" }
    LoopA: { $ref: "#/components/schemas/LoopB" }
    LoopB: { $ref: "#/components/schemas/LoopA" }
    UsesLoop:
      type: object
      properties:
        l: { $ref: "#/components/schemas/LoopA" }
    LoopNested: { anyOf: [{ anyOf: [{ $ref: "#/components/schemas/LoopNested" }] }] }
    LoopOrString: { anyOf: [{ $ref: "#/components/schemas/LoopOrString" }, { type: string }] }

# code: paths, a method, media types and channel names with `*/`, `"""`, backquotes,
# backslashes and `${`, and descriptions with every line break of the target languages. If any of
# them escaped, the rest of the text would be a syntax error, so every checker would fail.
openapi: 3.2.0

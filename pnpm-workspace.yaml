packages:
  - packages/*
  - runtimes/*
  - runtimes/typescript/hermes
  - examples/*
  # Its own workspace, installed and tested on its own.
  - "!examples/pnpm-monorepo"
  # Its own workspace too.
  - "!examples/react-tanstack"
allowBuilds:
  esbuild: false
  # Its postinstall only switches between its Vue 2 and Vue 3 files; the Vue 3 ones are the default.
  vue-demi: false
# Versions released less than 5 days (7200 minutes) ago are not installed: time for a compromised
# release to be found and pulled. Dependabot waits as long (.github/dependabot.yml).
minimumReleaseAge: 7200

openapi: 3.1.0
info: { title: Pets, version: "1" }
servers: [{ url: http://localhost:3000 }]
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: ok
          content:
            {
              application/json:
                { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } },
            }
    post:
      operationId: createPet
      tags: [pets]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NewPet" } } }
      responses:
        "201":
          description: created
          content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } }
        "422":
          description: invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
  /pets/{petId}:
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: ok
          content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } }
        "404":
          description: not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    delete:
      operationId: deletePet
      tags: [admin]
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: deleted }
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        tag: { type: string }
    NewPet:
      type: object
      required: [name]
      properties:
        name: { type: string }
        tag: { type: string }
    Problem:
      type: object
      required: [title]
      properties:
        title: { type: string }
        detail: { type: string }

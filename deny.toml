# cargo-deny: the dependencies of the workspace and of runtimes/rust (CI's `audit` job).
# Advisories from the RustSec database fail the build; licenses must be on the list below, which
# allows tsurara (MIT) and its binary to be redistributed with the notices of
# scripts/third-party-licenses.mjs; crates come from crates.io only.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# The workspace's own crates are MIT (LICENSE); `tsurara-testkit` and the examples are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[package]
name = "tsurara-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tsurara_cli"
path = "src/lib.rs"

[[bin]]
name = "tsurara"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tsurara-backend.workspace = true
tsurara-lower.workspace = true
tsurara-naming.workspace = true
tsurara-lang-python.workspace = true
tsurara-lang-go.workspace = true
tsurara-lang-rust.workspace = true
tsurara-lang-typescript.workspace = true
tsurara-sem.workspace = true
tsurara-config.workspace = true
tsurara-loader.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tsurara-sample.workspace = true
url.workspace = true

[dev-dependencies]
tsurara-backend = { workspace = true, features = ["schema"] }
tsurara-testkit = { path = "../tsurara-testkit" }
jsonschema.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
